<h1>Modular Forms Interactive Plots</h1>
<h2>Partition Function</h2>
<div class="compute"> <!--Do not make this indented;it will fail.-->
<script type="text/x-sage">
import numpy as np
def p(x):
    n = floor(x)
    return Partitions(n).cardinality()
@interact
def plot_partitions(X=slider([10,100,500,1000], label = r"$[0,X]$"),α = slider(range(1,11), label= r"$\alpha$"), frame1 = checkbox(False, label= r'$x^{\alpha}$')):
    alpha = α
    def power_alpha(x):
        return x^alpha
    p1 = list_plot( [p(n) for n in range(X+1)], legend_label = "p(n)")
    if frame1 == True:
        p1+= plot(power_alpha,(x,0,X), legend_label = r"$x^{\alpha},\alpha =$" + "{}".format(alpha),color = "red")
    p1.show()   
</script>
</div>
